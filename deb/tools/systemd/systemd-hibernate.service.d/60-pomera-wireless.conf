# pomera-kernel-tools: hibernate の前に Wi-Fi・Bluetooth のモジュールを外し、戻った後に入れ直す。
# 作者のイメージは /etc/systemd/system/systemd-hibernate.service.d/ に同じ名前の物を持つので、そちらが使われる。
[Service]
# ここで失敗すると hibernate を止める。ExecStopPost は失敗の時も走る。
ExecStartPre=/usr/libexec/pomera-kernel/hibernate-wireless prepare
ExecStopPost=/usr/libexec/pomera-kernel/hibernate-wireless restore
